<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<style>
  :root {
    /* 뉴트럴: 따뜻한 라이트 그레이 + 네이비 텍스트 */
    --bg: #F6F5F2;
    --surface: #FFFFFF;
    --surface-2: #F4F2ED;
    --ink: #22304C;
    --ink-soft: #55617A;
    --ink-faint: #8A93A5;
    --line: #E7E3DB;
    --line-strong: #D6D1C6;

    /* 매출=딥 테라코타-오렌지 / 수금=딥 카키-골드 */
    --sale: #BC5B36;
    --sale-ink: #8A3D22;
    --sale-soft: #F8E9E1;
    --sale-soft-strong: #EECCBB;

    --collect: #8A7A3A;
    --collect-ink: #5C5121;
    --collect-soft: #F2EEDC;
    --collect-soft-strong: #DBD1A4;

    --danger: #C0405A;
    --danger-soft: #F8E4E9;

    --radius-card: 18px;
    --radius-control: 12px;
    --shadow-card: 0 1px 2px rgba(34,48,76,0.05), 0 6px 18px -8px rgba(34,48,76,0.12);
    --shadow-widget: 0 2px 6px rgba(34,48,76,0.07), 0 16px 34px -14px rgba(34,48,76,0.20);

    --font-sans: "Pretendard Variable", "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic",
      -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #131A2A;
      --surface: #1B2438;
      --surface-2: #151D2E;
      --ink: #EAEEF6;
      --ink-soft: #B2BCCE;
      --ink-faint: #838EA3;
      --line: #2A3450;
      --line-strong: #3A4767;

      --sale: #E08A63;
      --sale-ink: #F1B79E;
      --sale-soft: #2F1F18;
      --sale-soft-strong: #43291F;

      --collect: #C9B368;
      --collect-ink: #E6D49A;
      --collect-soft: #262212;
      --collect-soft-strong: #39321C;

      --danger: #EE789A;
      --danger-soft: #2E1922;

      --shadow-card: 0 1px 2px rgba(0,0,0,0.35), 0 12px 28px -14px rgba(0,0,0,0.6);
      --shadow-widget: 0 2px 6px rgba(0,0,0,0.4), 0 18px 36px -16px rgba(0,0,0,0.7);
    }
  }
  :root[data-theme="dark"] {
    --bg: #131A2A; --surface: #1B2438; --surface-2: #151D2E;
    --ink: #EAEEF6; --ink-soft: #B2BCCE; --ink-faint: #838EA3;
    --line: #2A3450; --line-strong: #3A4767;
    --sale: #E08A63; --sale-ink: #F1B79E; --sale-soft: #2F1F18; --sale-soft-strong: #43291F;
    --collect: #C9B368; --collect-ink: #E6D49A; --collect-soft: #262212; --collect-soft-strong: #39321C;
    --danger: #EE789A; --danger-soft: #2E1922;
    --shadow-card: 0 1px 2px rgba(0,0,0,0.35), 0 12px 28px -14px rgba(0,0,0,0.6);
    --shadow-widget: 0 2px 6px rgba(0,0,0,0.4), 0 18px 36px -16px rgba(0,0,0,0.7);
  }
  :root[data-theme="light"] {
    --bg: #F6F5F2; --surface: #FFFFFF; --surface-2: #F4F2ED;
    --ink: #22304C; --ink-soft: #55617A; --ink-faint: #8A93A5;
    --line: #E7E3DB; --line-strong: #D6D1C6;
    --sale: #BC5B36; --sale-ink: #8A3D22; --sale-soft: #F8E9E1; --sale-soft-strong: #EECCBB;
    --collect: #8A7A3A; --collect-ink: #5C5121; --collect-soft: #F2EEDC; --collect-soft-strong: #DBD1A4;
    --danger: #C0405A; --danger-soft: #F8E4E9;
    --shadow-card: 0 1px 2px rgba(34,48,76,0.05), 0 6px 18px -8px rgba(34,48,76,0.12);
    --shadow-widget: 0 2px 6px rgba(34,48,76,0.07), 0 16px 34px -14px rgba(34,48,76,0.20);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  /* 버튼/입력은 더블탭 확대 지연 없이 즉각 반응하게 한다(스크롤/핀치줌은 그대로). */
  button, input, label, select, textarea, [role="button"] { touch-action: manipulation; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-sans);
    -webkit-font-smoothing: antialiased;
  }

  .page {
    max-width: 480px;
    margin: 0 auto;
    padding: 26px 16px calc(40px + env(safe-area-inset-bottom, 0px));
    display: flex;
    flex-direction: column;
    gap: 22px;
  }

  .masthead {
    position: relative;
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 2px 2px 10px;
  }
  .masthead .logo {
    width: 32px;
    height: auto;
    flex: none;
    margin-top: 1px;
    display: block;
  }
  .masthead-text { display: flex; flex-direction: column; gap: 4px; min-width: 0; padding-right: 44px; }
  .masthead .eyebrow {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.04em;
    color: var(--ink-faint);
  }
  .masthead h1 {
    margin: 0;
    font-size: 20px;
    font-weight: 800;
    line-height: 1.25;
    letter-spacing: -0.02em;
    word-break: keep-all;
    text-wrap: balance;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius-card);
    box-shadow: var(--shadow-card);
    overflow: hidden;
  }
  /* 주문 카드만 overflow를 풀어 '등록' 버튼의 sticky가 뷰포트 기준으로 동작하게 한다.
     (탭바 위쪽 모서리는 아래에서 직접 둥글려 카드 라운드와 맞춘다) */
  .order-card { overflow: visible; }

  /* 세그먼트 컨트롤 탭: 컨테이너(부드러운 회색) 안에서 선택된 탭만 브랜드색으로 꽉 채운다. */
  .tabbar {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    margin: 14px 14px 4px;
    padding: 6px;
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 16px;
  }
  .tab {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-family: var(--font-sans);
    font-size: 14.5px;
    font-weight: 800;
    letter-spacing: -0.01em;
    padding: 12px 10px;
    border: none;
    border-radius: 12px;
    background: transparent;
    color: var(--ink-soft);
    cursor: pointer;
    transition: background 160ms ease, color 160ms ease, box-shadow 160ms ease;
  }
  .tab-icon { display: inline-flex; flex: none; }
  .tab-icon svg { width: 17px; height: 17px; display: block; }
  .tab[data-tab="sale"][aria-selected="true"] { background: var(--sale); color: #FFFFFF; box-shadow: 0 5px 14px -4px rgba(188,91,54,0.55); }
  .tab[data-tab="collect"][aria-selected="true"] { background: var(--collect); color: #FFFFFF; box-shadow: 0 5px 14px -4px rgba(138,122,58,0.55); }

  .card-body {
    padding: 20px 18px 18px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .field { display: flex; flex-direction: column; gap: 7px; }
  .field-label {
    font-size: 12.5px;
    font-weight: 700;
    letter-spacing: 0.01em;
    color: var(--ink-soft);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .field-label .hint {
    font-weight: 500;
    font-size: 12px;
    color: var(--ink-faint);
    letter-spacing: 0;
  }

  .text-input {
    width: 100%;
    font-family: var(--font-sans);
    font-size: 19px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    padding: 14px 14px;
    border-radius: var(--radius-control);
    border: 1px solid var(--line);
    background: var(--surface-2);
    color: var(--ink);
    outline: none;
    transition: border-color 120ms ease, background 120ms ease, box-shadow 120ms ease;
  }
  .text-input::placeholder { color: var(--ink-faint); font-weight: 500; }
  [data-panel="sale"] .text-input:focus { background: var(--surface); border-color: var(--sale); box-shadow: 0 0 0 4px var(--sale-soft); }
  [data-panel="collect"] .text-input:focus { background: var(--surface); border-color: var(--collect); box-shadow: 0 0 0 4px var(--collect-soft); }

  .text-input.amount { font-size: 21px; }

  /* 발송일 지정 토글 + 날짜 입력 */
  .date-field { gap: 9px; }
  .date-toggle {
    display: flex;
    align-items: center;
    gap: 9px;
    font-size: 13.5px;
    font-weight: 700;
    color: var(--ink-soft);
    cursor: pointer;
    user-select: none;
  }
  .date-toggle input[type="checkbox"] { width: 18px; height: 18px; flex: none; }
  .date-toggle .hint { font-weight: 500; font-size: 12px; color: var(--ink-faint); }
  .date-input { font-size: 18px; }
  .date-input[hidden] { display: none; }
  .date-weekday {
    font-size: 14px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: var(--ink-soft);
    padding-left: 2px;
  }
  .date-weekday[hidden] { display: none; }
  .date-weekday .wd-sat { color: #2563eb; }
  .date-weekday .wd-sun { color: var(--danger); }
  [data-panel="sale"] .date-toggle input:checked { accent-color: var(--sale); }
  [data-panel="collect"] .date-toggle input:checked { accent-color: var(--collect); }

  .product-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .product-btn {
    position: relative;
    font-family: var(--font-sans);
    font-size: 13.5px;
    font-weight: 600;
    line-height: 1.32;
    color: var(--ink);
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 15px 12px;
    min-height: 56px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 9px;
    text-align: center;
    cursor: pointer;
    user-select: none;
    transition: border-color 120ms ease, background 120ms ease, color 120ms ease, box-shadow 120ms ease, min-height 140ms ease;
  }
  .product-btn__label { text-wrap: balance; }
  .product-btn--long { font-size: 12.5px; }
  .product-btn:not([aria-pressed="true"]):active { transform: scale(0.98); }
  .product-btn[aria-pressed="true"] {
    background: var(--sale-soft);
    border-color: var(--sale);
    color: var(--sale-ink);
    box-shadow: inset 0 0 0 1.5px var(--sale);
    min-height: 100px;
  }
  .product-btn__check {
    position: absolute;
    top: 8px;
    right: 8px;
    width: 15px;
    height: 15px;
    color: var(--sale);
    opacity: 0;
    transform: scale(0.55);
    transition: opacity 120ms ease, transform 120ms ease;
  }
  .product-btn[aria-pressed="true"] .product-btn__check {
    opacity: 1;
    transform: scale(1);
  }
  /* 선택 시 품목 버튼 안에서 바로 수량 조절(− qty +) */
  .pb-stepper { display: none; }
  .product-btn[aria-pressed="true"] .pb-stepper {
    display: inline-flex;
    align-items: center;
    background: var(--surface);
    border: 1.5px solid var(--sale-soft-strong);
    border-radius: 9px;
    overflow: hidden;
  }
  .pb-step {
    font-family: var(--font-sans);
    font-size: 21px;
    font-weight: 700;
    line-height: 1;
    color: var(--sale-ink);
    background: transparent;
    border: none;
    width: 42px;
    height: 38px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    user-select: none;
  }
  .pb-step:active { background: var(--sale-soft); }
  .pb-qty {
    min-width: 30px;
    text-align: center;
    font-size: 16px;
    font-weight: 800;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
  }

  .submit-btn {
    width: 100%;
    font-family: var(--font-sans);
    font-size: 16px;
    font-weight: 800;
    letter-spacing: -0.01em;
    padding: 16px;
    border-radius: 12px;
    border: none;
    color: #FFFFFF;
    cursor: pointer;
    transition: filter 120ms ease, transform 80ms ease, opacity 120ms ease;
    box-shadow: 0 8px 20px -8px rgba(15, 23, 42, 0.45);
  }
  .submit-btn:active { transform: scale(0.99); }
  .submit-btn:disabled { opacity: 0.4; cursor: not-allowed; box-shadow: none; }
  [data-panel="sale"] .submit-btn { background: var(--sale); }
  [data-panel="collect"] .submit-btn { background: #7E5F16; }

  /* 하단 결제바: 날짜 토글 + 등록 버튼을 카드 하단에 solid sticky로 고정.
     배경(surface) + 상단 테두리(border-t)로 스크롤 시 위 콘텐츠와 완전히 분리(겹침 방지).
     .order-card { overflow: visible }라야 sticky가 뷰포트 기준으로 동작한다. */
  .form-footer {
    position: sticky;
    bottom: 0;
    z-index: 5;
    display: flex;
    flex-direction: column;
    gap: 14px;
    margin: 8px -18px -18px;
    padding: 14px 18px calc(16px + env(safe-area-inset-bottom, 0px));
    background: var(--surface);
    border-top: 1px solid var(--line);
    border-radius: 0 0 calc(var(--radius-card) - 1px) calc(var(--radius-card) - 1px);
  }

  /* 통장잔고확인: 전표 등록과 구분되도록 아웃라인(보조) 버튼으로 둔다. */
  .balance-btn {
    margin-top: 10px;
    width: 100%;
    font-family: var(--font-sans);
    font-size: 14.5px;
    font-weight: 700;
    letter-spacing: -0.005em;
    padding: 13px;
    border-radius: var(--radius-control);
    border: 1.5px solid var(--collect-soft-strong);
    background: var(--collect-soft);
    color: var(--collect-ink);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    transition: opacity 120ms ease, transform 80ms ease;
  }
  .balance-btn:active { transform: scale(0.99); }
  .balance-btn:disabled { opacity: 0.65; cursor: progress; }
  .balance-btn svg { opacity: 0.9; }

  .balance-box {
    margin-top: 10px;
    padding: 18px 18px;
    border-radius: 14px;
    background: var(--surface-2);
    border: 1px solid var(--line);
  }
  .balance-box.is-error { border-color: var(--danger); }
  .balance-amount {
    font-size: 30px;
    font-weight: 900;
    letter-spacing: -0.02em;
    line-height: 1.15;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
  }
  .balance-box.is-error .balance-amount { color: var(--danger); font-size: 14.5px; font-weight: 700; }
  .balance-meta {
    margin-top: 3px;
    font-size: 12px;
    font-weight: 600;
    color: var(--ink-faint);
  }
  /* 통장잔고 위젯: 핀테크 대시보드 느낌 — 넉넉한 패딩 + 부드러운 그림자(shadow-md). */
  .balance-card { box-shadow: var(--shadow-widget); }
  .balance-card .card-body { padding: 20px; gap: 14px; }
  .balance-card .balance-btn,
  .balance-card .balance-box { margin-top: 0; }

  .card-body[hidden] { display: none; }

  .amount-preview {
    font-size: 13px;
    color: var(--ink-faint);
    min-height: 16px;
    font-variant-numeric: tabular-nums;
  }
  .amount-preview strong { color: var(--collect-ink); font-weight: 700; }

  .field-hint {
    font-size: 12.5px;
    font-weight: 600;
    color: var(--danger);
    min-height: 16px;
  }

  .customer-name {
    min-height: 0;
    display: flex;
  }
  .customer-name:empty { display: none; }
  .customer-name .chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 14px;
    font-weight: 800;
    letter-spacing: -0.01em;
    padding: 7px 12px 7px 10px;
    border-radius: 10px;
    max-width: 100%;
  }
  .customer-name .chip .chip-name {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .customer-name .chip svg { flex: none; }
  .customer-name[data-state="found"] .chip {
    background: var(--sale-soft);
    color: var(--sale-ink);
    box-shadow: 0 0 0 1px var(--sale-soft-strong) inset;
  }
  [data-panel="collect"] .customer-name[data-state="found"] .chip {
    background: var(--collect-soft);
    color: var(--collect-ink);
    box-shadow: 0 0 0 1px var(--collect-soft-strong) inset;
  }
  .customer-name[data-state="unknown"] .chip {
    background: var(--danger-soft);
    color: var(--danger);
    font-size: 12.5px;
    font-weight: 700;
  }

  /* 거래처 입력 방식 전환 (번호 / 이름) */
  .field-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .mode-toggle {
    display: inline-flex;
    flex: none;
    padding: 2px;
    gap: 2px;
    border-radius: 9px;
    background: var(--surface-2);
    box-shadow: 0 0 0 1px var(--line) inset;
  }
  .mode-btn {
    font-family: var(--font-sans);
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: 0.01em;
    color: var(--ink-faint);
    background: transparent;
    border: 0;
    border-radius: 7px;
    padding: 5px 11px;
    cursor: pointer;
    transition: color 120ms ease, background 120ms ease;
  }
  .mode-btn.is-on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(26,32,27,0.10); }
  [data-panel="sale"] .mode-btn.is-on { color: var(--sale-ink); }
  [data-panel="collect"] .mode-btn.is-on { color: var(--collect-ink); }
  @media (prefers-color-scheme: dark) {
    .mode-btn.is-on { box-shadow: 0 1px 2px rgba(0,0,0,0.35); }
  }

  /* 이름 검색 후보 목록 */
  .cust-suggest {
    display: flex;
    flex-direction: column;
    border-radius: var(--radius-control);
    border: 1.5px solid var(--line-strong);
    background: var(--surface);
    overflow: hidden;
    max-height: 264px;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  .cust-suggest[hidden] { display: none; }
  .sg-head {
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: 0.02em;
    color: var(--ink-faint);
    padding: 9px 12px 7px;
    background: var(--surface-2);
    border-bottom: 1px solid var(--line);
    position: sticky;
    top: 0;
  }
  .sg-empty { font-size: 13px; font-weight: 600; color: var(--ink-faint); padding: 14px 12px; }
  .sg-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    width: 100%;
    text-align: left;
    font-family: var(--font-sans);
    background: transparent;
    border: 0;
    border-bottom: 1px solid var(--line);
    padding: 11px 12px;
    cursor: pointer;
    min-height: 46px;
  }
  .sg-item:last-child { border-bottom: 0; }
  .sg-name {
    font-size: 14.5px;
    font-weight: 700;
    color: var(--ink);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .sg-name mark { background: transparent; color: inherit; font-weight: 900; text-decoration: underline; text-underline-offset: 3px; }
  .sg-text { display: flex; flex-direction: column; gap: 3px; min-width: 0; flex: 1; }
  .sg-sub {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink-soft);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .sg-sub-tag {
    flex: none;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.02em;
    color: var(--ink-faint);
    background: var(--surface-2);
    border-radius: 5px;
    padding: 1px 5px;
    box-shadow: 0 0 0 1px var(--line) inset;
  }
  .sg-sub mark { background: transparent; color: var(--ink); font-weight: 900; text-decoration: underline; text-underline-offset: 2px; }
  .sg-item.is-active .sg-sub mark { color: var(--sale-ink); }
  [data-panel="collect"] .sg-item.is-active .sg-sub mark { color: var(--collect-ink); }
  .sg-code {
    flex: none;
    font-size: 12px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    color: var(--ink-soft);
    background: var(--surface-2);
    border-radius: 6px;
    padding: 3px 7px;
    box-shadow: 0 0 0 1px var(--line) inset;
  }
  .sg-item.is-active { background: var(--sale-soft); }
  .sg-item.is-active .sg-name { color: var(--sale-ink); }
  .sg-item.is-active mark { color: var(--sale-ink); }
  [data-panel="collect"] .sg-item.is-active { background: var(--collect-soft); }
  [data-panel="collect"] .sg-item.is-active .sg-name,
  [data-panel="collect"] .sg-item.is-active mark { color: var(--collect-ink); }

  .log { display: flex; flex-direction: column; gap: 3px; }
  .log-title {
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: var(--ink-faint);
    padding: 0 2px 8px;
  }
  .log-empty { font-size: 13px; color: var(--ink-faint); padding: 14px 2px; }
  .log-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 11px 14px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
  }
  .log-item + .log-item { margin-top: 8px; }
  .kind-badge {
    flex: none;
    align-self: flex-start;
    margin-top: 1px;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.02em;
    padding: 3px 8px;
    border-radius: 8px;
  }
  .kind-badge.kind-sale { background: var(--sale-soft); color: var(--sale-ink); }
  .kind-badge.kind-collect { background: var(--collect-soft); color: var(--collect-ink); }
  .log-text { flex: 1; min-width: 0; }
  .log-text .main {
    font-size: 14px;
    font-weight: 700;
    color: var(--ink);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .log-text .sub {
    margin-top: 3px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 5px 10px;
    font-variant-numeric: tabular-nums;
  }
  .sub-line { display: inline-flex; align-items: center; gap: 5px; }
  .sub-product { font-size: 13.5px; font-weight: 700; color: var(--ink); }
  .sub-qty {
    font-size: 12px;
    font-weight: 700;
    color: var(--ink-soft);
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 1px 7px;
  }
  .sub-amount { font-size: 14px; font-weight: 800; color: var(--collect-ink); }
  .log-time { font-size: 11px; color: var(--ink-faint); font-variant-numeric: tabular-nums; white-space: nowrap; }

  .log-right { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; flex: none; }
  .status-badge {
    font-size: 11px;
    font-weight: 700;
    padding: 3px 9px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .status-badge[data-status="대기"]   { background: var(--line); color: var(--ink-soft); }
  .status-badge[data-status="처리중"] { background: #DDE7F5; color: #2E5AA8; }
  .status-badge[data-status="완료"]   { background: #E6EFE7; color: #3E7A55; }
  .status-badge[data-status="실패"]   { background: var(--danger-soft); color: var(--danger); }
  @media (prefers-color-scheme: dark) {
    .status-badge[data-status="처리중"] { background: #24344F; color: #9FBEEC; }
  }
  :root[data-theme="dark"] .status-badge[data-status="처리중"] { background: #24344F; color: #9FBEEC; }
  @media (prefers-color-scheme: dark) { .status-badge[data-status="완료"] { background: #1E3226; color: #7FC79A; } }
  :root[data-theme="dark"] .status-badge[data-status="완료"] { background: #1E3226; color: #7FC79A; }
  /* 수금→매출확인 추적 배지 */
  .status-badge[data-status="매출확인"] { background: #FBE7C7; color: #96610F; }
  .status-badge[data-status="매출완료"] { background: #E6EFE7; color: #3E7A55; }
  @media (prefers-color-scheme: dark) {
    .status-badge[data-status="매출확인"] { background: #3A2C12; color: #E7B45A; }
    .status-badge[data-status="매출완료"] { background: #1E3226; color: #7FC79A; }
  }
  :root[data-theme="dark"] .status-badge[data-status="매출확인"] { background: #3A2C12; color: #E7B45A; }
  :root[data-theme="dark"] .status-badge[data-status="매출완료"] { background: #1E3226; color: #7FC79A; }
  /* 중복확인: 더블탭으로 들어온 중복 전표. 다른 상태와 헷갈리지 않게 보라 계열로 구분. */
  .status-badge[data-status="중복확인"] { background: #EBE4F5; color: #6B4BA3; }
  @media (prefers-color-scheme: dark) {
    .status-badge[data-status="중복확인"] { background: #2E2447; color: #B79BE6; }
  }
  :root[data-theme="dark"] .status-badge[data-status="중복확인"] { background: #2E2447; color: #B79BE6; }
  .mark-sale-btn {
    font-family: var(--font-sans);
    font-size: 11.5px;
    font-weight: 800;
    color: #FFFFFF;
    background: var(--sale);
    border: 0;
    border-radius: 8px;
    padding: 5px 10px;
    cursor: pointer;
    white-space: nowrap;
  }
  .mark-sale-btn:active { opacity: 0.7; }
  .mark-sale-btn:disabled { opacity: 0.5; cursor: progress; }

  .statement-link {
    font-size: 11.5px;
    font-weight: 700;
    color: var(--collect-ink);
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 3px;
    white-space: nowrap;
  }
  .statement-link:active { opacity: 0.6; }

  .retry-btn {
    font-family: var(--font-sans);
    font-size: 11.5px;
    font-weight: 800;
    color: var(--danger);
    background: var(--danger-soft);
    border: 0;
    border-radius: 7px;
    padding: 4px 9px;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    white-space: nowrap;
    cursor: pointer;
  }
  .retry-btn:active { opacity: 0.6; }
  .retry-btn:disabled { opacity: 0.5; cursor: default; }

  .refresh-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 2px 8px;
  }
  .refresh-btn {
    font-family: var(--font-sans);
    font-size: 11.5px;
    font-weight: 700;
    color: var(--ink-soft);
    background: transparent;
    border: none;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 2px 4px;
  }
  .refresh-btn:active { opacity: 0.5; }

  /* PC시계: 카드 안(탭바 아래) 오른쪽에 간결하게 표시. */
  .card-clockbar { padding: 11px 18px 0; text-align: right; }

  /* 상도인 PC의 현재 시각(사용자가 인위적으로 맞춘 값)을 폰에서 확인. 왼쪽 정렬. */
  .pc-clock {
    margin-right: auto;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 11.5px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: var(--ink-soft);
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 4px 10px;
    white-space: nowrap;
  }
  .pc-clock .pc-badge {
    font-size: 10px;
    font-weight: 800;
    padding: 1px 6px;
    border-radius: 999px;
    background: var(--line);
    color: var(--ink-soft);
  }
  /* 데스크탑 날짜가 실제 오늘보다 미래(내일 등) — 사용자가 시계를 앞당겨 둔 상태 */
  .pc-clock.is-future { border-color: var(--collect-soft-strong); color: var(--collect-ink); background: var(--collect-soft); }
  .pc-clock.is-future .pc-badge { background: var(--collect-soft-strong); color: var(--collect-ink); }
  /* 과거이거나 폴링 응답이 끊긴 상태 — 주의 */
  .pc-clock.is-warn { border-color: var(--danger); color: var(--danger); }
  .pc-clock.is-warn .pc-badge { background: var(--danger-soft); color: var(--danger); }
  .pc-clock.is-stale { opacity: 0.55; }
  /* hidden 속성이 위 display:inline-flex에 덮이지 않게(데이터 없을 때 빈 알약 방지) */
  .pc-clock[hidden] { display: none; }
  /* 상도인 재부팅: 우측 상단 미니멀 전원 아이콘(웜 코랄, 배경/테두리 없는 선형). */
  .restart-app-btn {
    flex: none;
    position: absolute;
    top: 4px;
    right: 2px;
    width: 40px;
    height: 40px;
    padding: 0;
    color: #E05252;
    background: transparent;
    border: none;
    border-radius: 999px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .restart-app-btn:active { opacity: 0.5; }
  .restart-app-btn:disabled { opacity: 0.45; cursor: progress; }
  .restart-app-ico { display: block; }

  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(20px + env(safe-area-inset-bottom, 0px));
    transform: translate(-50%, 12px);
    background: var(--ink);
    color: var(--bg);
    font-size: 13.5px;
    font-weight: 600;
    padding: 12px 18px;
    border-radius: 999px;
    box-shadow: 0 10px 30px -8px rgba(0,0,0,0.4);
    opacity: 0;
    pointer-events: none;
    transition: opacity 180ms ease, transform 180ms ease;
    max-width: calc(100% - 40px);
    text-align: center;
    z-index: 20;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* 리마인더 모달(수금 등록 후 매출확인 안내) */
  .modal-overlay {
    position: fixed;
    inset: 0;
    z-index: 40;
    background: rgba(20, 26, 40, 0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .modal-overlay[hidden] { display: none; }
  .modal-card {
    width: 100%;
    max-width: 340px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 18px;
    box-shadow: var(--shadow-widget);
    padding: 22px 20px 18px;
    text-align: center;
  }
  .modal-title { font-size: 16.5px; font-weight: 800; color: var(--ink); margin-bottom: 10px; }
  .modal-body { font-size: 13.5px; font-weight: 500; line-height: 1.65; color: var(--ink-soft); margin-bottom: 18px; }
  .modal-body b { color: var(--sale-ink); font-weight: 800; }
  .modal-ok {
    width: 100%;
    font-family: var(--font-sans);
    font-size: 15px;
    font-weight: 800;
    color: #FFFFFF;
    background: var(--collect);
    border: 0;
    border-radius: 12px;
    padding: 14px;
    cursor: pointer;
  }
  .modal-ok:active { opacity: 0.85; }

  .footnote {
    font-size: 12px;
    color: var(--ink-faint);
    text-align: center;
    padding: 4px 8px 0;
    line-height: 1.55;
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>

          <div class="mode-toggle" role="group" aria-label="거래처 입력 방식">

          class="text-input"

          autocomplete="off"

      <div class="form-footer">
        <!-- 발송일 지정: 끄면 오늘(데스크탑 날짜)로 저장, 켜면 지정한 날짜로 전표를 저장한다. -->

<script>
  const tabs = document.querySelectorAll(".tab");
  const panels = document.querySelectorAll(".card-body[data-panel]");
  tabs.forEach((tab) => {
    tab.addEventListener("click", () => {
      tabs.forEach((t) => t.setAttribute("aria-selected", String(t === tab)));
      panels.forEach((p) => {
        p.hidden = p.dataset.panel !== tab.dataset.tab;
      });
      // 통장잔고 카드는 별도 섹션이라 여기서 함께 토글한다(수금전표 탭에서만 표시).
      const bc = document.getElementById("balance-card");
      if (bc) bc.hidden = tab.dataset.tab !== "collect";
    });

    '<svg class="product-btn__check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6"/></svg>';

  const PRODUCTS = [
    { value: "제주절임무<제주.아이스>", label: "제주절임무<br><제주.아이스>", long: true },
    { value: "제주절임무<인천.아이스>", label: "제주절임무<br><인천.아이스>", long: true },
    { value: "무김치", label: "무김치" },
    { value: "백김치", label: "백김치" },
    { value: "쪽파김치", label: "쪽파김치" },
    { value: "쌈무", label: "쌈무" },
    { value: "양념다대기(10kg)", label: "양념다대기(10kg)" },
    { value: "양념다대기(5kg)", label: "양념다대기(5kg)" },
    { value: "무말랭이(제주산)", label: "무말랭이(제주산)" },
    { value: "고소한향미유(1.8L)", label: "고소한향미유(1.8L)" },
    { value: "최가네배추김치", label: "최가네배추김치" },
    { value: "매실농축액", label: "매실농축액" },
  ];

  const grid = document.getElementById("product-grid");

  // 선택한 품목들: [{ value, qty }] (선택한 순서 유지)
  let selectedItems = [];

  PRODUCTS.forEach((p) => {
    // 품목 버튼 안에 수량 스테퍼(− qty +)를 함께 넣는다. 버튼 안에 버튼을 담아야 해서
    // product-btn 자체는 <button>이 아니라 <div role="button">로 만든다.
    const btn = document.createElement("div");
    btn.setAttribute("role", "button");
    btn.className = "product-btn" + (p.long ? " product-btn--long" : "");
    btn.setAttribute("aria-pressed", "false");
    btn.dataset.value = p.value;
    btn.innerHTML =
      '<span class="product-btn__label">' + p.label + "</span>" + CHECK_SVG +
      '<div class="pb-stepper">' +
        '<button type="button" class="pb-step" data-act="dec" aria-label="수량 줄이기">−</button>' +
        '<span class="pb-qty">1</span>' +
        '<button type="button" class="pb-step" data-act="inc" aria-label="수량 늘리기">＋</button>' +
      "</div>";
    btn.addEventListener("click", (e) => {

        } else {

        }
      } else if (idx < 0) {
        selectedItems.push({ value: p.value, qty: 1 }); // 몸통 탭: 새로 담기(수량 1)
      } else {
        return; // 이미 선택된 카드 몸통 탭은 무시(실수 해제 방지 — 해제는 − 로만)
      }

  // 각 품목 버튼에 선택여부(aria-pressed)와 현재 수량을 반영한다.
  function renderProducts() {
    grid.querySelectorAll(".product-btn").forEach((b) => {
      const it = selectedItems.find((s) => s.value === b.dataset.value);
      b.setAttribute("aria-pressed", it ? "true" : "false");
      if (it) b.querySelector(".pb-qty").textContent = it.qty;
    });
  }

  // 웹에서는 업체코드를 그대로(0을 채우지 않아도) 입력하면 된다. 조회는 정확한
  // 코드로 하므로 애매하게 겹치지 않는다. 상도인에 입력할 때만 RPA가 6자리로
  // 0을 채운다(main.py). 그래서 웹은 길이 제한 없이 코드만 입력하면 된다.
  function customerHintText(value) {
    return "";
  }

  // 거래처번호 -> 거래처명 조회표 (구글 시트 '거래처' 탭에서 불러온다).
  const customerMap = new Map();
  const saleCheckSet = new Set(); // 매출확인 대상 거래처(정규화 코드) — 거래처시트 E열이 채워진 곳
  // 거래처명 검색용 색인. fetchCustomers()에서 한 번만 만든다.
  let customerIndex = [];

  // ── 거래처명 검색 ───────────────────────────────────────────────
  // 이름은 표기가 제각각이라("㈜현대마트", "현대 마트", "현대마트(본점)")
  // 비교용 이름을 따로 만든다. 회사 형태 표기와 공백/기호를 걷어내고,
  // 원본 글자 위치를 map에 같이 담아 나중에 일치 구간을 굵게 칠할 때 쓴다.
  const CORP_WORDS = ["주식회사", "유한회사", "합자회사", "(주)", "(유)", "㈜", "㈔"];
  const DROP_CHARS = " \t -_.,·‧・/\\'\"()[]{}&+";

  function normalizeName(name) {
    const src = String(name);
    const norm = [];
    const map = [];
    let i = 0;
    outer: while (i < src.length) {
      for (let w = 0; w < CORP_WORDS.length; w++) {
        const word = CORP_WORDS[w];
        if (src.startsWith(word, i)) {
          i += word.length;
          continue outer;
        }
      }
      const ch = src.charAt(i);
      if (DROP_CHARS.indexOf(ch) === -1) {
        norm.push(ch.toLowerCase());
        map.push(i);
      }
      i += 1;
    }
    return { norm: norm.join(""), map: map };
  }

  // 이름 안의 낱말 구간. map에서 원본 글자가 건너뛰어진 자리가 곧 낱말 경계다.
  // ("현대 마트" -> "현대", "마트") 낱말 첫글자 일치를 따로 쳐주려고 쓴다.
  function buildTokens(norm, map) {
    const tokens = [];
    let start = 0;
    for (let i = 1; i <= norm.length; i++) {
      if (i === norm.length || map[i] - map[i - 1] > 1) {
        if (i > start) tokens.push({ text: norm.slice(start, i), at: start });
        start = i;
      }
    }
    return tokens;
  }

  // 한글 첫소리(초성)만 뽑아낸다. "현대마트" -> "ㅎㄷㅁㅌ"
  const CHO_TABLE = "ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ";
  function toChoseong(s) {
    let out = "";
    for (let i = 0; i < s.length; i++) {
      const c = s.charCodeAt(i);
      if (c >= 0xac00 && c <= 0xd7a3) {
        out += CHO_TABLE.charAt(Math.floor((c - 0xac00) / 588));
      } else {
        out += s.charAt(i);
      }
    }
    return out;
  }
  // 질의가 전부 자음 낱글자(ㄱ~ㅎ)인지. 초성 검색은 이때만 켠다.
  // 그러지 않으면 "현대"가 "행복도매" 같은 데까지 걸려서 후보가 지저분해진다.
  function isChoseongQuery(s) {
    if (!s) return false;
    for (let i = 0; i < s.length; i++) {
      const c = s.charCodeAt(i);
      if (c < 0x3131 || c > 0x314e) return false;
    }
    return true;
  }

  // 질의 글자가 순서대로 들어 있는지 (예: "현마트" -> "현대마트").
  // 너무 멀리 흩어져 있으면 남남으로 본다.
  function subsequenceAt(q, text) {
    let first = -1;
    let ti = 0;
    for (let qi = 0; qi < q.length; qi++) {
      const found = text.indexOf(q.charAt(qi), ti);
      if (found === -1) return -1;
      if (first === -1) first = found;
      ti = found + 1;
    }
    if (ti - first > q.length * 3) return -1;
    return first;
  }

  // 오타 한두 글자까지 봐주는 비교 (후보가 하나도 없을 때만 쓴다).
  function withinDistance(a, b, max) {
    if (Math.abs(a.length - b.length) > max) return false;
    let prev = [];
    for (let j = 0; j <= b.length; j++) prev.push(j);
    for (let i = 1; i <= a.length; i++) {
      const row = [i];
      let best = i;
      for (let j = 1; j <= b.length; j++) {
        const cost = a.charAt(i - 1) === b.charAt(j - 1) ? 0 : 1;
        const v = Math.min(prev[j] + 1, row[j - 1] + 1, prev[j - 1] + cost);
        row.push(v);
        if (v < best) best = v;
      }
      if (best > max) return false;
      prev = row;
    }
    return prev[b.length] <= max;
  }

  // 검색 대상 한 덩어리(거래처명 / 대표자명 / 입금자명 하나)를 미리 가공해 둔다.
  // 거래처명뿐 아니라 대표자·입금자도 같은 방식으로 조회하기 위해 공통화했다.
  function buildUnit(text) {
    const src = String(text == null ? "" : text);
    const norm = normalizeName(src);
    return {
      text: src,
      norm: norm.norm,
      map: norm.map,
      cho: toChoseong(norm.norm),
      tokens: buildTokens(norm.norm, norm.map),
    };
  }

  // 입금자명 칸(D열)에는 여러 명이 들어갈 수 있다. 쉼표·줄바꿈·슬래시·가운뎃점
  // 등 무엇으로 구분했든 받아준다. "박영자(와이프)" 같은 괄호 메모는 그대로 둔다
  // (화면엔 메모째로 보여주고, 대조할 때만 normalizeName이 괄호를 걷어낸다).
  function parsePayerUnits(raw) {
    return String(raw == null ? "" : raw)
      .split(/[,\n;/·、|]+/)
      .map((s) => s.trim())
      .filter((s) => s.length > 0)
      .map(buildUnit)
      .filter((u) => u.norm.length > 0);
  }

  // 한 덩어리(unit)에 대한 점수. 정확한 일치일수록 높게 준다.
  // null이면 매칭 실패. at은 원본 text에서 일치가 시작된 글자 위치.
  function scoreUnit(unit, q, qIsCho) {
    const n = unit.norm;
    if (!n) return null;
    const extra = Math.min(60, Math.max(0, n.length - q.length));

    if (n === q) return { score: 1000, at: 0, len: q.length };
    if (n.indexOf(q) === 0) return { score: 900 - extra, at: 0, len: q.length };

    for (let t = 0; t < unit.tokens.length; t++) {
      const tk = unit.tokens[t];
      if (tk.at > 0 && tk.text.indexOf(q) === 0) {
        return { score: 800 - extra, at: tk.at, len: q.length };
      }
    }

    const pos = n.indexOf(q);
    if (pos > 0) return { score: 700 - pos * 3 - extra, at: pos, len: q.length };

    if (qIsCho) {
      const cpos = unit.cho.indexOf(q);
      if (cpos === 0) return { score: 640 - extra, at: 0, len: q.length };
      if (cpos > 0) return { score: 580 - cpos * 3 - extra, at: cpos, len: q.length };
    }

    if (q.length >= 3) {
      const sub = subsequenceAt(q, n);
      if (sub !== -1) return { score: 450 - sub * 2 - extra, at: sub, len: 0 };
    }
    return null;
  }

  // 필드별 우선순위. 같은 강도의 일치라면 거래처명 > 입금자명 > 대표자명 순으로
  // 위에 오게 점수에서 살짝 깎는다 (밴드 간격 100보다 작아 강도 순서는 안 깨진다).
  const SOURCE_PENALTY = { name: 0, payer: 20, rep: 40 };

  const SUGGEST_LIMIT = 8;

  function searchCustomers(rawQuery) {
    const query = String(rawQuery).trim();
    if (!query || customerIndex.length === 0) return [];

    const qIsCho = isChoseongQuery(query.replace(/\s/g, ""));
    const q = normalizeName(query).norm;
    if (!q) return [];
    const isDigits = /^[0-9]+$/.test(q);

    const hits = [];
    for (let i = 0; i < customerIndex.length; i++) {
      const c = customerIndex[i];
      // 이름 모드에서 숫자를 쳤다면 업체코드 앞자리로도 찾아준다.
      if (isDigits && c.code.indexOf(q) === 0) {
        hits.push({
          c: c, source: "code", unit: null, at: -1, len: 0,
          score: (c.code === q ? 980 : 860) - (c.code.length - q.length),
        });
        continue;
      }

      // 거래처명(A) · 입금자명(D) · 대표자명(C)을 모두 대조해서 가장 좋은 걸 고른다.
      // 입금자명은 은행 문자의 입금자로 찾을 때 핵심이라 여러 명을 각각 본다.
      let best = null;
      const consider = (unit, source) => {
        if (!unit) return;
        const m = scoreUnit(unit, q, qIsCho);
        if (!m) return;
        const s = m.score - SOURCE_PENALTY[source];
        if (!best || s > best.score) {
          best = { c: c, source: source, unit: unit, at: m.at, len: m.len, score: s };
        }
      };
      consider(c.nameUnit, "name");
      for (let p = 0; p < c.payerUnits.length; p++) consider(c.payerUnits[p], "payer");
      consider(c.repUnit, "rep");
      if (best) hits.push(best);
    }

    // 아무것도 안 걸리면 오타로 보고 거래처명만 한 번 더 훑는다.
    if (hits.length === 0 && q.length >= 2 && !qIsCho) {
      const tol = q.length >= 5 ? 2 : 1;
      for (let i = 0; i < customerIndex.length; i++) {
        const c = customerIndex[i];
        const head = c.nameUnit.norm.slice(0, q.length + tol);
        if (withinDistance(q, head, tol)) {
          hits.push({ c: c, source: "name", unit: c.nameUnit, at: -1, len: 0, score: 300 - c.nameUnit.norm.length });
        }
      }
    }

    hits.sort(
      (a, b) =>
        (b.score - a.score) ||
        (a.c.nameUnit.norm.length - b.c.nameUnit.norm.length) ||
        (Number(a.c.code) - Number(b.c.code))
    );
    return hits;
  }

  // 매칭된 덩어리(unit)의 일치 구간만 굵게. at은 비교용 문자열 기준이라
  // map으로 원본 위치로 되돌린다.
  function highlightMatch(hit) {
    const unit = hit.unit;
    const text = unit ? unit.text : hit.c.name;
    if (!unit || hit.at < 0 || hit.len <= 0) return escapeHtml(text);
    const map = unit.map;
    const s = map[hit.at];
    const endIdx = map[Math.min(hit.at + hit.len - 1, map.length - 1)];
    if (s == null || endIdx == null) return escapeHtml(text);
    const e = endIdx + 1;
    return (
      escapeHtml(text.slice(0, s)) +
      "<mark>" + escapeHtml(text.slice(s, e)) + "</mark>" +
      escapeHtml(text.slice(e))
    );
  }

  const CHECK_ICON =
    '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6"/></svg>';
  const WARN_ICON =
    '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4"/><path d="M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>';

  function renderCustomerName(value, nameEl) {
    if (value.length === 0) {
      nameEl.innerHTML = "";
      nameEl.removeAttribute("data-state");
      return;
    }
    // 앞의 0이 있어도(005812) 없어도(5812) 숫자로 맞춰서 조회
    const code = String(Number(value));
    const name = customerMap.get(code);
    if (name) {
      nameEl.innerHTML =
        '<span class="chip">' + CHECK_ICON + '<span class="chip-name">' + escapeHtml(name) + "</span></span>";
      nameEl.setAttribute("data-state", "found");
    } else if (customerMap.size === 0) {
      nameEl.innerHTML = "";
      nameEl.removeAttribute("data-state");
    } else {
      nameEl.innerHTML =
        '<span class="chip">' + WARN_ICON + '<span class="chip-name">등록되지 않은 거래처번호입니다</span></span>';
      nameEl.setAttribute("data-state", "unknown");
    }
  }

  // 거래처 입력칸 하나를 통째로 맡는다. 번호 모드(기본)와 이름 모드를 오간다.
  // 대부분은 번호를 알고 있으니 번호 모드가 기본이고, 번호를 모를 때만 이름으로
  // 찾은 뒤 고른 거래처의 '번호'를 칸에 채워 넣고 번호 모드로 되돌아온다.
  // 그래서 전송 payload(customer_no)는 언제나 업체코드 그대로다.
  function createCustomerField(prefix, onChange, initialMode = "code", nameLabel = "거래처명") {
    const input = document.getElementById(prefix + "-customer");
    const head = document.getElementById(prefix + "-customer-head");
    const listEl = document.getElementById(prefix + "-customer-suggest");
    const modeHint = head.querySelector('[data-role="mode-hint"]');
    const modeBtns = head.querySelectorAll(".mode-btn");

    let mode = "code";
    let hits = [];
    let activeIdx = -1;

    function closeList() {
      hits = [];
      activeIdx = -1;
      listEl.hidden = true;
      listEl.innerHTML = "";
    }

    function renderList() {
      if (mode !== "name" || input.value.trim() === "") {
        closeList();
        return;
      }
      if (customerIndex.length === 0) {
        listEl.innerHTML = '<div class="sg-empty">거래처 목록을 불러오는 중입니다…</div>';
        listEl.hidden = false;
        return;
      }
      const shown = hits.slice(0, SUGGEST_LIMIT);
      if (shown.length === 0) {
        listEl.innerHTML = '<div class="sg-empty">일치하는 거래처가 없습니다</div>';
        listEl.hidden = false;
        return;
      }
      let html = "";
      if (hits.length > 1) {
        html +=
          '<div class="sg-head">유사 거래처 ' + hits.length + "곳" +
          (hits.length > SUGGEST_LIMIT ? " (상위 " + SUGGEST_LIMIT + "곳)" : "") +
          " · 골라주세요</div>";
      }
      html += shown
        .map((h, i) => {
          // 본문은 언제나 거래처명(=신원). 거래처명 자체로 잡혔을 때만 굵게 칠하고,
          // 대표자·입금자로 잡혔을 때는 아래에 "왜 잡혔는지" 꼬리표를 단다.
          const nameHtml = h.source === "name" ? highlightMatch(h) : escapeHtml(h.c.name);
          let sub = "";
          if (h.source === "rep") {
            sub = '<span class="sg-sub"><span class="sg-sub-tag">대표</span>' + highlightMatch(h) + "</span>";
          } else if (h.source === "payer") {
            sub = '<span class="sg-sub"><span class="sg-sub-tag">입금</span>' + highlightMatch(h) + "</span>";
          }
          return (
            '<button class="sg-item' + (i === activeIdx ? " is-active" : "") + '" type="button" role="option" data-idx="' + i + '">' +
              '<span class="sg-text">' +
                '<span class="sg-name">' + nameHtml + "</span>" +
                sub +
              "</span>" +
              '<span class="sg-code">' + escapeHtml(h.c.code) + "</span>" +
            "</button>"
          );
        })
        .join("");
      listEl.innerHTML = html;
      listEl.hidden = false;
    }

    function moveActive(step) {
      const max = Math.min(hits.length, SUGGEST_LIMIT);
      if (max === 0) return;
      activeIdx = (activeIdx + step + max) % max;
      renderList();
      const el = listEl.querySelector(".sg-item.is-active");
      if (el && el.scrollIntoView) el.scrollIntoView({ block: "nearest" });
    }

    function pick(i) {
      const hit = hits[i];
      if (!hit) return;
      setMode("code", false);
      input.value = hit.c.code;
      onChange();
      input.blur();
    }

    function setMode(next, focus) {
      mode = next;
      input.value = "";
      closeList();
      modeBtns.forEach((b) => {
        const on = b.dataset.mode === next;
        b.classList.toggle("is-on", on);
        b.setAttribute("aria-pressed", on ? "true" : "false");
      });
      if (next === "code") {
        input.type = "tel";
        input.inputMode = "numeric";
        input.setAttribute("pattern", "[0-9]*");
        input.maxLength = 8;
        input.placeholder = "예: 2, 14244";
        modeHint.textContent = "업체코드";
      } else {
        input.type = "text";
        input.inputMode = "text";
        input.removeAttribute("pattern");
        input.maxLength = 30;
        input.placeholder = "예: 호랑이, ㅎㄹㅇㅈㅂ";
        modeHint.textContent = nameLabel + "으로 검색";
      }
      // 모바일에서 키보드 종류를 바꾸려면 포커스를 한 번 놓았다 잡아야 한다.
      if (focus) {
        input.blur();
        input.focus();
      }
      onChange();
    }

    modeBtns.forEach((b) => {
      b.addEventListener("click", () => {
        if (b.dataset.mode === mode) {
          input.focus();
          return;
        }
        setMode(b.dataset.mode, true);
      });
    });

    input.addEventListener("input", () => {
      if (mode === "code") {
        input.value = input.value.replace(/[^0-9]/g, "");
        closeList();
      } else {
        hits = searchCustomers(input.value);
        // 제일 그럴듯한 후보를 미리 짚어 둔다. 엔터 한 번으로 끝내라고.
        activeIdx = hits.length > 0 ? 0 : -1;
        renderList();
      }
      onChange();
    });

    input.addEventListener("keydown", (e) => {
      if (mode !== "name" || listEl.hidden) return;
      if (e.key === "ArrowDown") {
        e.preventDefault();
        moveActive(1);
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        moveActive(-1);
      } else if (e.key === "Enter") {
        if (activeIdx >= 0) {
          e.preventDefault();
          pick(activeIdx);
        }
      } else if (e.key === "Escape") {
        e.preventDefault();
        closeList();
      }
    });

    // 목록을 탭할 때 input이 먼저 blur돼서 목록이 닫히는 걸 막는다.
    listEl.addEventListener("mousedown", (e) => e.preventDefault());
    listEl.addEventListener("click", (e) => {
      const item = e.target.closest(".sg-item");
      if (item) pick(Number(item.dataset.idx));
    });

    input.addEventListener("blur", () => {
      // 탭 판정이 끝난 뒤에 닫는다.
      setTimeout(() => {
        if (document.activeElement !== input) closeList();
      }, 120);
    });

    return {
      input: input,
      isCode: () => mode === "code",
      // 목록이 늦게 도착했을 때 이미 친 글자로 다시 검색해 준다.
      refresh: () => {
        if (mode === "name" && input.value.trim() !== "") {
          hits = searchCustomers(input.value);
          activeIdx = hits.length > 0 ? 0 : -1;
          renderList();
        }
      },
      reset: () => setMode(initialMode, false),
      applyInitialMode: () => setMode(initialMode, false),
    };
  }

  // 구글 시트(Apps Script)로 주문을 전송한다.
  // Content-Type을 application/json으로 하면 브라우저가 사전 확인(preflight) 요청을
  // 보내는데 Apps Script가 이를 처리하지 못해 실패한다. text/plain으로 우회한다.
  const BACKEND_URL =
    "https://script.google.com/macros/s/AKfycbyRf4ehDK5B9k3Ux5gj6rSmjkzUG9eEISrHiJr-ESUZgY_2Z1_rDKOVWILsq4rkvrKJ/exec";
  const BACKEND_TOKEN = "Wlnf-dtU30cJ5S9U4G8iF63hg_jx3mxC";

  async function submitOrder(payload) {
    const res = await fetch(BACKEND_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain" },
      body: JSON.stringify(Object.assign({ token: BACKEND_TOKEN, action: "submit" }, payload)),

  }

  // 구글 시트에서 최근 주문의 처리 상태를 읽어와 표시한다.
  function escapeHtml(s) {
    return String(s).replace(/[&<>"]/g, (c) =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])
    );
  }

  // 매출 주문의 품목 목록을 뽑는다. 새 형식은 product_name 칸에 JSON 배열
  // ([{product_name, quantity}, ...])이 들어 있고, 예전 단일 형식은 product_name +
  // quantity 칸이 따로 있다. 둘 다 지원한다.
  function parseSaleItems(o) {
    if (typeof o.product_name === "string" && o.product_name.trim().charAt(0) === "[") {
      try {
        const arr = JSON.parse(o.product_name);
        if (Array.isArray(arr)) {
          return arr.map((x) => ({
            name: x.product_name != null ? x.product_name : x[0],
            qty: x.quantity != null ? x.quantity : x[1],
          }));
        }
      } catch (e) {}
    }
    return [{ name: o.product_name, qty: o.quantity }];
  }

  function renderRecent(orders) {

        const codeKey = String(Number(o.customer_no));

        // 매출확인 대상 거래처(거래처시트 E열)의 수금이 완료되면, 초록 '완료' 대신
        // 매출전표를 직접 넣었는지 추적하는 상태를 보여준다(L열=sale_checked에 저장).
        const saleCheckTarget = kind === "collect" && saleCheckSet.has(codeKey);
        let right;
        if (saleCheckTarget && status === "완료") {

          } else {

              '<span class="status-badge" data-status="매출확인">매출확인 필요</span>' +
              '<button class="mark-sale-btn" type="button" data-mark-sale="1" data-row="' +
              escapeHtml(String(o.row)) + '">매출 처리함</button>';
          }
        } else {
          right = '<span class="status-badge" data-status="' + escapeHtml(status) + '">' + escapeHtml(status) + "</span>";
        }
        if (o.statement_url) {
          right +=
            '<a class="statement-link" href="' + escapeHtml(o.statement_url) + '" target="_blank" rel="noopener">' +
            '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>' +
            "거래내역서</a>";
        }
        // 실패한 건은 다시시도 버튼을 단다. 여러 품목 매출은 이미 저장된 품목이
        // 중복될 수 있어 클릭 시 확인창을 띄우도록 data-multi로 표시해 둔다.
        if (status === "실패") {
          const multi = kind === "sale" && parseSaleItems(o).length > 1;
          right +=
            '<button class="retry-btn" type="button" data-retry="1" data-row="' +
            escapeHtml(String(o.row)) + '" data-multi="' + (multi ? "1" : "") + '">' +
            '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>' +
            "다시시도</button>";
        }
        return (
          '<div class="log-item" data-kind="' + kind + '">' +
            '<span class="kind-badge kind-' + kind + '">' + (kind === "collect" ? "수금" : "매출") + "</span>" +

  // 진행중(대기/처리중)인 주문이 있으면 빠르게, 전부 끝났으면(완료/실패) 느리게
  // 자동 새로고침한다. 사용자가 전표를 막 등록해 결과를 지켜보는 동안만 자주 돌고,
  // 한가할 때는 구글 서버로 요청을 덜 보내 부담을 줄인다.
  const RECENT_FAST_MS = 2000;   // 진행중인 주문이 있을 때
  const RECENT_SLOW_MS = 8000;   // 전부 완료/실패로 한가할 때
  const RECENT_BOOST_MS = 15000; // 전표 등록 직후, 첫 '대기' 행이 뜨기 전까지의 여유
  let recentActive = false;      // 마지막 조회에 진행중인 건이 있었나
  let recentBoostUntil = 0;      // 이 시각 전까지는 무조건 빠르게 돈다
  let recentTimer = null;

  function recentHasActive(orders) {
    return (orders || []).some((o) => {
      const s = o.status || "대기";
      return s !== "완료" && s !== "실패" && s !== "중복확인";
    });
  }

  async function fetchRecent() {
    try {
      const url = BACKEND_URL + "?action=recent&limit=15&token=" + encodeURIComponent(BACKEND_TOKEN);
      const res = await fetch(url);
      const data = await res.json();
      if (data.ok) {
        renderRecent(data.orders);

        updatePcClock(data.desktop_time, data.desktop_time_at);
      }
    } catch (err) {
      // 조회 실패 시 조용히 무시 (다음 주기에 다시 시도)
    }
  }

  // 상도인 PC의 현재 시각을 표시한다. 사용자가 택배 마감 후 데스크탑 시계를 다음날로
  // 바꾸는데, 지금 며칠 몇 시로 맞춰져 있는지 폰에서 바로 확인하기 위함.
  //   dtStr : "YYYY-MM-DD HH:MM:SS" (RPA가 보고한 데스크탑 벽시계)
  //   atIso : 서버가 그 보고를 받은 시각(ISO). 오래됐으면 폴링이 끊긴 것.
  const PC_WEEKDAYS = ["일", "월", "화", "수", "목", "금", "토"];
  function updatePcClock(dtStr, atIso) {
    const el = document.getElementById("pc-clock");
    if (!el) return;
    if (!dtStr) { el.hidden = true; return; }

    const parts = String(dtStr).split(" ");
    const dm = (parts[0] || "").split("-").map(Number); // [y, m, d]
    if (dm.length < 3 || dm.some(isNaN)) { el.hidden = true; return; }
    const [y, m, d] = dm;
    const hm = (parts[1] || "").slice(0, 5); // "HH:MM"
    const dt = new Date(y, m - 1, d);
    const wd = PC_WEEKDAYS[dt.getDay()];

    // 폰의 실제 오늘과 비교해 며칠 차이인지(데스크탑 시계가 앞/뒤로 얼마나 가 있는지)
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const diffDays = Math.round((dt.getTime() - today.getTime()) / 86400000);

    let badge, cls;
    if (diffDays === 0) { badge = "오늘"; cls = ""; }
    else if (diffDays === 1) { badge = "내일"; cls = "is-future"; }
    else if (diffDays > 1) { badge = diffDays + "일 후"; cls = "is-future"; }
    else if (diffDays === -1) { badge = "어제"; cls = "is-warn"; }
    else { badge = -diffDays + "일 전"; cls = "is-warn"; }

    // 폴링 생존 확인: 보고 시각(서버)이 25초 넘게 지났으면 RPA 폴링이 끊긴 것으로 본다.
    let stale = false;
    if (atIso) {
      const age = (Date.now() - new Date(atIso).getTime()) / 1000;
      if (age > 25) stale = true;
    }

    el.hidden = false;
    el.className = "pc-clock" + (cls ? " " + cls : "") + (stale ? " is-stale" : "");
    const label = String(m).padStart(2, "0") + "-" + String(d).padStart(2, "0") + "(" + wd + ") " + hm;
    el.innerHTML =
      escapeHtml(label) +
      ' <span class="pc-badge">' + escapeHtml(stale ? "응답없음" : badge) + "</span>";
  }

  function scheduleRecent() {
    clearTimeout(recentTimer);
    const boosting = Date.now() < recentBoostUntil;
    const delay = recentActive || boosting ? RECENT_FAST_MS : RECENT_SLOW_MS;
    recentTimer = setTimeout(runRecentCycle, delay);
  }

  async function runRecentCycle() {
    await fetchRecent();
    scheduleRecent();
  }

  // 즉시 한 번 새로고침하고 주기를 다시 잡는다 (수동 새로고침·전표 등록 직후에 사용).
  function kickRecent() {
    clearTimeout(recentTimer);
    runRecentCycle();
  }

  function boostRecent() {
    recentBoostUntil = Date.now() + RECENT_BOOST_MS;

  // 실패 항목의 "다시시도" 버튼. 목록은 매 주기 다시 그려지므로 개별 버튼이 아니라

  logList.addEventListener("click", async (e) => {
    const btn = e.target.closest("[data-retry]");

    const row = Number(btn.dataset.row);

    // 여러 품목 매출은 앞 품목이 이미 저장됐을 수 있어 중복 위험을 알리고 확인받는다.
    if (btn.dataset.multi === "1") {
      const ok = window.confirm(

          "그래도 다시 시도할까요?"
      );
      if (!ok) return;
    }

    btn.disabled = true;
    try {
      const res = await fetch(BACKEND_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify({ token: BACKEND_TOKEN, action: "retry", row: row }),

      const data = await res.json();
      if (data.ok) {
        showToast("다시 대기열에 넣었습니다. 잠시 후 재처리됩니다.");
        boostRecent();
      } else if (data.error === "not_failed") {
        // 더블탭 등으로 이미 상태가 바뀐 경우
        showToast("이미 처리 상태가 바뀌었습니다.");
        kickRecent();
      } else {
        showToast("재시도 요청 실패. 다시 눌러주세요.");
        btn.disabled = false;
      }
    } catch (err) {
      showToast("전송 실패: 인터넷 연결을 확인해주세요.");
      btn.disabled = false;
    }
  });

  // '매출 처리함' — 수금에 대한 매출전표를 상도인에 직접 넣었다고 표시(L열=완료).
  logList.addEventListener("click", async (e) => {
    const btn = e.target.closest("[data-mark-sale]");
    if (!btn) return;
    const row = Number(btn.dataset.row);
    if (!row) return;
    btn.disabled = true;
    try {
      const res = await fetch(BACKEND_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify({ token: BACKEND_TOKEN, action: "mark_sale_checked", row: row }),
      });
      const data = await res.json();
      if (data.ok) {

        showToast("매출확인 처리했습니다.");

        showToast("처리 실패. 다시 눌러주세요.");
        btn.disabled = false;
      }
    } catch (err) {
      showToast("전송 실패: 인터넷 연결을 확인해주세요.");
      btn.disabled = false;
    }
  });

  runRecentCycle();

  // 페이지 열릴 때 거래처 목록을 한 번 불러와 조회표를 만든다.
  async function fetchCustomers() {
    try {
      const url = BACKEND_URL + "?action=customers&token=" + encodeURIComponent(BACKEND_TOKEN);
      const res = await fetch(url);
      const data = await res.json();
      if (data.ok && Array.isArray(data.customers)) {
        customerMap.clear();
        saleCheckSet.clear();
        const index = [];
        data.customers.forEach((c) => {
          // 업체코드를 숫자 문자열로 정규화해서 저장 (앞의 0 제거)
          const code = String(Number(c.code));
          if (code && code !== "NaN" && c.name) {
            customerMap.set(code, c.name);
            if (c.sale_check) saleCheckSet.add(code);
            // 이름 검색용 색인은 여기서 한 번만 만들어 둔다 (타이핑할 때마다 만들면 느리다).
            // 거래처명(A) 외에 대표자명(C)·입금자명(D)도 같이 색인해서 이름 탭 하나로
            // 셋 다 조회되게 한다. rep/payers 필드가 없는 예전 응답이어도 안전하다.
            const repStr = c.rep == null ? "" : String(c.rep).trim();
            index.push({
              code: code,
              name: String(c.name),
              nameUnit: buildUnit(c.name),
              repUnit: repStr ? buildUnit(repStr) : null,
              payerUnits: parsePayerUnits(c.payers),
            });
          }
        });
        customerIndex = index;
        // 이미 입력돼 있으면 즉시 반영
        updateSaleState();
        updateCollectState();
        saleField.refresh();
        collectField.refresh();
        // 최근 처리 현황도 거래처명으로 다시 그린다 (목록이 늦게 로드된 경우 대비)
        fetchRecent();
      }
    } catch (err) {
      // 거래처 목록 로딩 실패 시 조용히 무시 (조회 기능만 비활성, 입력은 정상)
    }
  }
  fetchCustomers();

  // ── 햅틱(진동) 피드백 ──────────────────────────────────────────────
  // 갤럭시 등 안드로이드는 navigator.vibrate를 지원한다(iOS는 미지원 → 조용히 무시).
  // 버튼을 누르는 순간(pointerdown) 아주 짧게 떨어 "눌렸다"는 촉각 확인을 준다.
  function haptic(pattern) {
    try { if (navigator.vibrate) navigator.vibrate(pattern); } catch (e) {}
  }
  // 모든 버튼류 탭에 가벼운 진동 한 번. 비활성 버튼은 제외.
  document.addEventListener(
    "pointerdown",
    (e) => {
      const b = e.target.closest("button, .tab, [role='button']");
      if (b && !b.disabled) haptic(8);
    },
    { passive: true }
  );

  // ── 발송일 지정 ────────────────────────────────────────────────
  // 토글을 끄면 payload에 voucher_date를 넣지 않아 RPA가 오늘(데스크탑 날짜)로 저장한다.
  // 켜면 지정한 날짜(YYYY-MM-DD)를 함께 보내 상도인 전표일자 칸을 그 날짜로 바꿔 저장한다.
  function ymd(d) {
    return (
      d.getFullYear() +
      "-" + String(d.getMonth() + 1).padStart(2, "0") +
      "-" + String(d.getDate()).padStart(2, "0")
    );
  }
  function createDateField(panel, onChange) {
    const toggle = document.getElementById(panel + "-date-on");
    const input = document.getElementById(panel + "-date");
    const wd = document.getElementById(panel + "-date-wd");
    // 선택한 날짜 옆에 요일을 보여준다(웹 표시 전용 — RPA로 가는 값은 숫자와 '-'만).
    // 토=파랑, 일=빨강으로 강조. 날짜 문자열은 그대로 두고 요일만 덧붙인다.
    function renderWd() {
      const v = input.value;
      if (toggle.checked && v) {
        const p = v.split("-");
        const day = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2])).getDay();
        const cls = day === 0 ? "wd-sun" : day === 6 ? "wd-sat" : "";
        wd.innerHTML = v + " (<span class=\"" + cls + "\">" + PC_WEEKDAYS[day] + "</span>)";
        wd.hidden = false;
      } else {
        wd.hidden = true;
      }
    }
    toggle.addEventListener("change", () => {
      if (toggle.checked) {
        // 어제부터 선택 가능(마감 이후 전일자 전표 입력 대응). 그 이전은 오타 방지로 차단.
        const minD = new Date();
        minD.setDate(minD.getDate() - 1);
        input.min = ymd(minD);
        if (!input.value) {
          const t = new Date();
          t.setDate(t.getDate() + 1); // 기본값: 내일(가장 흔한 경우)
          input.value = ymd(t);
        }
        input.hidden = false;
      } else {
        input.hidden = true;
      }
      renderWd();
      onChange();
    });
    input.addEventListener("change", () => {
      renderWd();
      onChange();
    });
    return {
      value() {
        return toggle.checked && input.value ? input.value : "";
      },
      short() {
        const v = this.value();
        return v ? v.slice(5) : ""; // MM-DD
      },
      reset() {
        toggle.checked = false;
        input.hidden = true;
        input.value = "";
        wd.hidden = true;
      },
    };
  }
  function saleLabel() {
    const d = saleDate.short();
    return "매출전표 등록" + (d ? " · " + d : "");
  }
  function collectLabel() {
    const d = collectDate.short();
    return "수금전표 등록" + (d ? " · " + d : "");
  }
  const saleDate = createDateField("sale", () => {
    if (saleSubmit.textContent !== "등록 중...") saleSubmit.textContent = saleLabel();
  });
  const collectDate = createDateField("collect", () => {
    if (collectSubmit.textContent !== "등록 중...") collectSubmit.textContent = collectLabel();
  });

  saleSubmit.addEventListener("click", async () => {
    if (saleSubmit.disabled) return;
    const vdate = saleDate.value();
    const payload = {
      type: "sale",
      customer_no: saleCustomer.value.trim(),
      // 여러 품목: [{ product_name, quantity }, ...]
      items: selectedItems.map((it) => ({ product_name: it.value, quantity: it.qty })),
    };
    if (vdate) payload.voucher_date = vdate; // 지정 발송일(없으면 오늘)

    saleSubmit.disabled = true;
    saleSubmit.textContent = "등록 중...";
    try {
      await submitOrder(payload);
      haptic([0, 18, 60, 18]); // 성공: 짧게 두 번
      showToast(
        "매출전표 등록됨" + (vdate ? " · " + vdate + " 발송일" : "") +
        " (상도인 반영은 잠시 후 처리됩니다)"
      );
      boostRecent();

      saleField.reset();
      saleDate.reset();
      selectedItems = [];
      renderProducts();
    } catch (err) {
      haptic([0, 50, 40, 50]); // 실패: 길게 두 번(성공과 구분)
      showToast("전송 실패: 인터넷 연결을 확인하고 다시 시도해주세요.");
    } finally {
      saleSubmit.textContent = saleLabel();
      updateSaleState();
    }
  });

  // 매출확인 리마인더 모달: 대상 거래처의 수금 등록 직후 뜬다.
  const saleReminder = document.getElementById("sale-reminder");
  const saleReminderBody = document.getElementById("sale-reminder-body");
  function showSaleReminder(custName) {
    saleReminderBody.innerHTML =
      (custName ? "<b>" + escapeHtml(custName) + "</b> 입금이 등록됐습니다.<br>" : "입금이 등록됐습니다.<br>") +
      "이 거래처는 주문문자를 보내지 않습니다.<br><b>매출전표를 직접 입력</b>했는지 확인하세요.";
    saleReminder.hidden = false;
    // 이 팝업은 놓치면 안 되므로 진동 API가 허용하는 최대치(길고 반복되는 패턴)로 강하게 알린다.
    haptic([400, 150, 400, 150, 400]);
  }
  document.getElementById("sale-reminder-ok").addEventListener("click", () => { saleReminder.hidden = true; });
  saleReminder.addEventListener("click", (e) => { if (e.target === saleReminder) saleReminder.hidden = true; });

  collectSubmit.addEventListener("click", async () => {
    if (collectSubmit.disabled) return;
    const vdate = collectDate.value();
    // 등록 후 필드를 비우므로 거래처 코드/이름을 지금 붙잡아 둔다.
    const custCode = String(Number(collectCustomer.value.trim()));
    const needSaleCheck = saleCheckSet.has(custCode); // 주문문자 안 보내는 거래처면 매출확인 리마인더
    const custName = customerMap.get(custCode) || "";
    const payload = {
      type: "collect",
      customer_no: collectCustomer.value.trim(),
      amount: Number(rawAmount()),
    };
    if (vdate) payload.voucher_date = vdate; // 지정 발송일(없으면 오늘)

    collectSubmit.disabled = true;
    collectSubmit.textContent = "등록 중...";
    try {
      await submitOrder(payload);
      haptic([0, 18, 60, 18]); // 성공: 짧게 두 번
      showToast(
        "수금전표 등록됨" + (vdate ? " · " + vdate + " 발송일" : "") +
        " (상도인 반영은 잠시 후 처리됩니다)"
      );
      boostRecent();

      collectField.reset();
      collectDate.reset();
      collectAmount.value = "";
      collectPreview.textContent = "";
      if (needSaleCheck) showSaleReminder(custName); // 매출전표 직접 입력 리마인더
    } catch (err) {
      haptic([0, 50, 40, 50]); // 실패: 길게 두 번(성공과 구분)
      showToast("전송 실패: 인터넷 연결을 확인하고 다시 시도해주세요.");
    } finally {
      collectSubmit.textContent = collectLabel();
      updateCollectState();
    }
  });

  // ── 통장잔고확인 ───────────────────────────────────────────────
  // 버튼을 누르면 백엔드에 조회 요청을 남기고(request_balance), RPA가 상도인
  // '통장계좌관리'에서 누적잔액을 읽어 보고(report_balance)할 때까지 get_balance를
  // 폴링한다. 전표처럼 시트에 행을 쌓지 않고 Script Properties에만 오간다.
  const balanceBtn = document.getElementById("balance-btn");
  const balanceBtnLabel = document.getElementById("balance-btn-label");
  const balanceBox = document.getElementById("balance-box");
  const balanceAmount = document.getElementById("balance-amount");
  const balanceMeta = document.getElementById("balance-meta");
  let balancePolling = false;

  function fmtWon(v) {
    const n = Number(v);
    return (isNaN(n) ? String(v) : n.toLocaleString("ko-KR")) + "원";
  }

  // ISO 시각을 "방금 확인 / N분 전 확인 / 14:22 확인" 식으로 짧게 표시한다.
  function shortSince(iso) {
    if (!iso) return "";
    const t = new Date(iso).getTime();
    if (isNaN(t)) return "";
    const sec = Math.max(0, Math.round((Date.now() - t) / 1000));
    if (sec < 15) return "방금 확인";
    if (sec < 60) return sec + "초 전 확인";
    if (sec < 3600) return Math.floor(sec / 60) + "분 전 확인";
    const d = new Date(t);
    return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0") + " 확인";
  }

  function showBalanceValue(value, checkedAt) {
    balanceBox.hidden = false;
    balanceBox.classList.remove("is-error");
    balanceAmount.textContent = fmtWon(value);
    balanceMeta.textContent = shortSince(checkedAt);
  }
  function showBalanceError(msg) {
    balanceBox.hidden = false;
    balanceBox.classList.add("is-error");
    balanceAmount.textContent = msg || "잔고를 읽지 못했습니다";
    balanceMeta.textContent = "다시 시도해주세요";
  }

  async function getBalance() {
    const url = BACKEND_URL + "?action=get_balance&token=" + encodeURIComponent(BACKEND_TOKEN);
    const res = await fetch(url);
    return res.json();
  }

  function setBalanceBusy(busy) {
    balanceBtn.disabled = busy;
    balanceBtnLabel.textContent = busy ? "상도인 확인 중..." : "통장잔고확인";
  }

  async function pollBalanceUntilDone() {
    // request_balance가 status를 '대기'로 덮어썼으므로, 이후 처음 보는 '완료'는
    // 반드시 이번 요청의 결과다(직전 값이 잘못 잡힐 염려 없음). 최대 약 90초 대기.
    const deadline = Date.now() + 90000;
    while (Date.now() < deadline) {
      await new Promise((r) => setTimeout(r, 2000));
      let data;
      try {
        data = await getBalance();
      } catch (e) {
        continue; // 일시적 통신 오류는 다음 폴링에서 재시도
      }
      if (!data || !data.ok) continue;
      if (data.status === "완료") {
        showBalanceValue(data.value, data.checked_at);
        return true;
      }
      if (data.status === "실패") {
        showBalanceError(data.error || "누적잔액을 읽지 못했습니다");
        return true;
      }
      // status가 대기/처리중이면 계속 기다린다.
    }
    return false; // 타임아웃
  }

  balanceBtn.addEventListener("click", async () => {
    if (balancePolling) return;
    balancePolling = true;
    setBalanceBusy(true);
    if (!balanceBox.hidden && !balanceBox.classList.contains("is-error")) {
      balanceMeta.textContent = "새로 확인하는 중...";
    }
    try {
      const res = await fetch(BACKEND_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify({ token: BACKEND_TOKEN, action: "request_balance" }),
      });
      const data = await res.json();
      if (!data.ok) {
        showToast("요청 실패. 다시 눌러주세요.");
        return;
      }
      const done = await pollBalanceUntilDone();
      if (!done) {
        showBalanceError("시간이 초과됐습니다");
        showToast("상도인 PC 응답이 늦습니다. 잠시 후 다시 시도해주세요.");
      }
    } catch (err) {
      showToast("전송 실패: 인터넷 연결을 확인해주세요.");
    } finally {
      setBalanceBusy(false);
      balancePolling = false;
    }
  });

  // 페이지 로드 시 마지막으로 확인된 잔고를 한 번 보여준다(있으면).
  (async () => {
    try {
      const data = await getBalance();
      if (data && data.ok && data.value && data.status !== "실패") {
        showBalanceValue(data.value, data.checked_at);
      }
    } catch (e) {}
  })();
  // ───────────────────────────────────────────────────────────────

  // ── 상도인 재부팅 ──────────────────────────────────────────────
  // 상도인이 먹통(약 1시간 뒤 응답 없음)일 때 누르면 RPA가 강제 종료 후 다시 켠다.
  // 재실행+로그인에 시간이 걸려 get_restart를 최대 ~150초까지 폴링한다.
  const restartBtn = document.getElementById("restart-app-btn");
  const restartLabel = document.getElementById("restart-app-label");
  let restartPolling = false;

  async function getRestart() {
    const url = BACKEND_URL + "?action=get_restart&token=" + encodeURIComponent(BACKEND_TOKEN);
    const res = await fetch(url);
    return res.json();
  }

  async function pollRestartUntilDone() {
    // request_restart가 status를 '대기'로 덮어썼으므로, 이후 처음 보는 완료/실패가
    // 이번 요청의 결과다. 재실행+로그인 여유를 넉넉히 준다.
    const deadline = Date.now() + 150000;
    while (Date.now() < deadline) {
      await new Promise((r) => setTimeout(r, 3000));
      let data;
      try {
        data = await getRestart();
      } catch (e) {
        continue;
      }
      if (!data || !data.ok) continue;
      if (data.status === "완료") return { ok: true };
      if (data.status === "실패") return { ok: false, error: data.error };
    }
    return null; // 타임아웃
  }

  restartBtn.addEventListener("click", async () => {
    if (restartPolling) return;
    const ok = window.confirm(
      "상도인을 강제 종료하고 다시 켤까요?\n\n" +
        "상도인에서 저장하지 않은 작업이 있으면 사라질 수 있습니다.\n" +
        "먹통(응답 없음)일 때 복구하는 용도입니다."
    );
    if (!ok) return;

    restartPolling = true;
    restartBtn.disabled = true;
    restartLabel.textContent = "재부팅 중...";
    try {
      const res = await fetch(BACKEND_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify({ token: BACKEND_TOKEN, action: "request_restart" }),
      });
      const data = await res.json();
      if (!data.ok) {
        showToast("요청 실패. 다시 눌러주세요.");
        return;
      }
      showToast("상도인 재부팅 요청됨. 잠시만 기다려주세요...");
      const result = await pollRestartUntilDone();
      if (result === null) {
        showToast("재부팅 응답이 늦습니다. 상도인 PC를 확인해주세요.");
      } else if (result.ok) {
        showToast("상도인 재부팅 완료. 실패한 건에 '다시시도'를 눌러주세요.");
        kickRecent();
      } else {
        showToast("상도인 재부팅 실패: " + (result.error || "PC 확인 필요"));
      }
    } catch (err) {
      showToast("전송 실패: 인터넷 연결을 확인해주세요.");
    } finally {
      restartBtn.disabled = false;
      restartLabel.textContent = "상도인 재부팅";
      restartPolling = false;
    }
  });
  // ───────────────────────────────────────────────────────────────
</script>
